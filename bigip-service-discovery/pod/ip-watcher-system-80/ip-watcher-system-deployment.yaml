apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ip-watcher-system-app
  name: ip-watcher-system-app
  namespace: ip-watcher-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ip-watcher-system-app
  template:
    metadata:
      labels:
        app: ip-watcher-system-app
    spec:
      containers:
      - env:
        - name: service_name
          value: ip-watcher-system-app
        image: f5devcentral/f5-hello-world:latest
        imagePullPolicy: Always
        name: ip-watcher-system-app
        ports:
        - containerPort: 8080
          protocol: TCP