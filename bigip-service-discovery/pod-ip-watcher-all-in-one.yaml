apiVersion: v1
kind: Namespace
metadata:
  name: ip-watcher-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-ip-watcher-sa
  namespace: ip-watcher-system
---
# Least-privilege Role scoped strictly to the default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-ip-watcher-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# Bind the default namespace Role to the ServiceAccount in ip-watcher-system
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-ip-watcher-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pod-ip-watcher-sa
    namespace: ip-watcher-system
roleRef:
  kind: Role
  name: pod-ip-watcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-ip-watcher-script
  namespace: ip-watcher-system
data:
  pod_ip_watcher.py: |
    #!/usr/bin/env python3
    import http.server
    import json
    import logging
    import os
    import signal
    import socketserver
    import sys
    import threading
    import time
    from datetime import datetime, timezone
    from kubernetes import client, config, watch
    from kubernetes.client.rest import ApiException

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
        stream=sys.stdout
    )

    stop_requested = False

    def handle_signal(signum, frame):
        global stop_requested
        logging.info(f"Received signal {signum}. Initiating graceful shutdown...")
        stop_requested = True

    signal.signal(signal.SIGTERM, handle_signal)
    signal.signal(signal.SIGINT, handle_signal)

    def load_k8s_config():
        try:
            config.load_incluster_config()
            logging.info("Authenticated using in-cluster ServiceAccount.")
        except config.ConfigException:
            config.load_kube_config()
            logging.info("Authenticated using local kubeconfig.")

    def extract_pod_info(pod):
        if not pod.status or not pod.status.pod_ip:
            return None

        pod_ip = pod.status.pod_ip
        name = pod.metadata.name
        namespace = pod.metadata.namespace

        # Schema specifically tailored for AS3 HTTP / Consul Service Discovery
        return {
            "id": name,
            "name": name,
            "namespace": namespace,
            "pod_ip": pod_ip,
            "ip": {
                "private": pod_ip,
                "public": pod_ip
            },
            "host_ip": pod.status.host_ip,
            "phase": pod.status.phase,
            "node_name": pod.spec.node_name,
            "labels": pod.metadata.labels or {}
        }

    def write_json_atomically(pods_state, output_path):
        target_dir = os.path.dirname(output_path)
        if target_dir:
            os.makedirs(target_dir, exist_ok=True)

        sorted_pods = sorted(list(pods_state.values()), key=lambda p: (p["namespace"], p["name"]))

        # 1. Write the raw array file directly for AS3
        array_path = f"{output_path}.array.json"
        temp_array = f"{array_path}.tmp"
        with open(temp_array, "w", encoding="utf-8") as f:
            json.dump(sorted_pods, f, indent=2)
        os.replace(temp_array, array_path)

        # 2. Write the standard metadata-wrapped dict file for logging/inspection
        temp_path = f"{output_path}.tmp"
        payload = {
            "last_updated": datetime.now(timezone.utc).isoformat(),
            "total_pods": len(sorted_pods),
            "pods": sorted_pods
        }
        with open(temp_path, "w", encoding="utf-8") as f:
            json.dump(payload, f, indent=2)
        os.replace(temp_path, output_path)

        logging.info(f"Updated cache with {len(sorted_pods)} active Pod records.")

    class AS3ServiceDiscoveryHTTPHandler(http.server.BaseHTTPRequestHandler):
        output_path = "/data/pod_ips.json"
        sd_service_name = "my-service"

        def do_GET(self):
            array_file = f"{self.output_path}.array.json"
            expected_prefix = f"/v1/health/service/{self.sd_service_name}"

            # If requesting the AS3 endpoint, ALWAYS return the raw JSON Array
            if self.path.startswith(expected_prefix) or self.path == "/" or self.path == "/nodes":
                if os.path.exists(array_file):
                    with open(array_file, "rb") as f:
                        content = f.read()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(content)))
                    self.end_headers()
                    self.wfile.write(content)
                else:
                    # Return an empty JSON array if no pods exist yet
                    empty_arr = b"[]\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(empty_arr)))
                    self.end_headers()
                    self.wfile.write(empty_arr)

            # Metadata endpoint for troubleshooting
            elif self.path.startswith("/debug") or self.path.startswith("/data/pod_ips.json"):
                if os.path.exists(self.output_path):
                    with open(self.output_path, "rb") as f:
                        content = f.read()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(content)))
                    self.end_headers()
                    self.wfile.write(content)
                else:
                    self.send_response(404)
                    self.end_headers()
                    self.wfile.write(b'{"error": "data not ready yet"}\n')
            else:
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b'{"error": "not found"}\n')

        def log_message(self, format, *args):
            return

    def start_http_server(host="0.0.0.0", port=8080, output_path="/data/pod_ips.json", sd_service_name="my-service"):
        AS3ServiceDiscoveryHTTPHandler.output_path = output_path
        AS3ServiceDiscoveryHTTPHandler.sd_service_name = sd_service_name

        class ReusableTCPServer(socketserver.TCPServer):
            allow_reuse_address = True

        server = ReusableTCPServer((host, port), AS3ServiceDiscoveryHTTPHandler)
        server_thread = threading.Thread(target=server.serve_forever, daemon=True)
        server_thread.start()
        logging.info(f"Embedded HTTP SD server active on http://{host}:{port}/v1/health/service/{sd_service_name}?passing=true")
        return server

    def watch_pods(namespace="default", output_path="/data/pod_ips.json"):
        load_k8s_config()
        v1 = client.CoreV1Api()
        pods_state = {}

        logging.info(f"Pod IP Watcher starting. Monitoring namespace: '{namespace}'")

        while not stop_requested:
            try:
                logging.info(f"Listing Pods in namespace: {namespace}")
                pod_list = v1.list_namespaced_pod(namespace=namespace)
                list_func = v1.list_namespaced_pod
                watch_kwargs = {"namespace": namespace}

                pods_state.clear()
                for pod in pod_list.items:
                    key = f"{pod.metadata.namespace}/{pod.metadata.name}"
                    info = extract_pod_info(pod)
                    if info:
                        pods_state[key] = info

                write_json_atomically(pods_state, output_path)
                resource_version = pod_list.metadata.resource_version

                w = watch.Watch()
                logging.info(f"Watching Pod events in namespace '{namespace}' starting at resourceVersion={resource_version}")

                for event in w.stream(
                    list_func,
                    resource_version=resource_version,
                    timeout_seconds=300,
                    **watch_kwargs
                ):
                    if stop_requested:
                        w.stop()
                        break

                    event_type = event["type"]
                    pod = event["object"]
                    key = f"{pod.metadata.namespace}/{pod.metadata.name}"
                    changed = False

                    if event_type in ("ADDED", "MODIFIED"):
                        new_info = extract_pod_info(pod)
                        if new_info:
                            if pods_state.get(key) != new_info:
                                pods_state[key] = new_info
                                changed = True
                        else:
                            if key in pods_state:
                                del pods_state[key]
                                changed = True

                    elif event_type == "DELETED":
                        if key in pods_state:
                            del pods_state[key]
                            changed = True

                    if changed:
                        logging.info(f"Pod event '{event_type}' for {key} triggered update.")
                        write_json_atomically(pods_state, output_path)

            except ApiException as e:
                if e.status == 410:
                    logging.warning("Watch stream expired (410 Gone). Re-syncing...")
                else:
                    logging.error(f"Kubernetes API error: {e.status} - {e.reason}. Retrying in 5s...")
                    time.sleep(5)
            except Exception as e:
                logging.error(f"Watcher loop error: {e}. Retrying in 5s...")
                time.sleep(5)

        logging.info("Pod IP watcher process exited cleanly.")

    if __name__ == "__main__":
        target_namespace = os.getenv("TARGET_NAMESPACE", "default").strip() or "default"
        output_file = os.getenv("OUTPUT_FILE_PATH", "/data/pod_ips.json").strip()
        service_name = os.getenv("SD_SERVICE_NAME", "my-service").strip()
        http_port = int(os.getenv("HTTP_PORT", "8080"))

        start_http_server(port=http_port, output_path=output_file, sd_service_name=service_name)
        watch_pods(namespace=target_namespace, output_path=output_file)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-ip-watcher
  namespace: ip-watcher-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-ip-watcher
  template:
    metadata:
      labels:
        app: pod-ip-watcher
    spec:
      serviceAccountName: pod-ip-watcher-sa
      initContainers:
        - name: install-deps
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing Python Kubernetes client..."
              pip install --no-cache-dir --target=/deps "kubernetes>=29.0.0"
              echo "Dependencies installed successfully."
          volumeMounts:
            - name: python-deps
              mountPath: /deps
      containers:
        - name: watcher
          image: python:3.11-slim
          command:
            - python
            - -u
            - /scripts/pod_ip_watcher.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/deps"
            - name: TARGET_NAMESPACE
              value: "default"
            - name: OUTPUT_FILE_PATH
              value: "/data/pod_ips.json"
            - name: SD_SERVICE_NAME
              value: "my-service"
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http-sd
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: python-deps
              mountPath: /deps
            - name: output-data
              mountPath: /data
      volumes:
        - name: script-vol
          configMap:
            name: pod-ip-watcher-script
        - name: python-deps
          emptyDir: {}
        - name: output-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pod-ip-watcher-sd
  namespace: ip-watcher-system
spec:
  type: ClusterIP
  selector:
    app: pod-ip-watcher
  ports:
    - name: http
      port: 8080
      targetPort: 8080