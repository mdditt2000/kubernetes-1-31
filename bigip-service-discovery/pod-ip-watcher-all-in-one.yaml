apiVersion: v1
kind: Namespace
metadata:
  name: ip-watcher-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-ip-watcher-sa
  namespace: ip-watcher-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-ip-watcher-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-ip-watcher-binding
subjects:
  - kind: ServiceAccount
    name: pod-ip-watcher-sa
    namespace: ip-watcher-system
roleRef:
  kind: ClusterRole
  name: pod-ip-watcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-ip-watcher-script
  namespace: ip-watcher-system
data:
  pod_ip_watcher.py: |
    # (Insert pod_ip_watcher.py script contents from Section 1 here)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-ip-watcher
  namespace: ip-watcher-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-ip-watcher
  template:
    metadata:
      labels:
        app: pod-ip-watcher
    spec:
      serviceAccountName: pod-ip-watcher-sa
      initContainers:
        - name: install-deps
          image: python:3.11-slim
          command: ["pip", "install", "--no-cache-dir", "--target=/deps", "kubernetes>=29.0.0"]
          volumeMounts:
            - name: python-deps
              mountPath: /deps
      containers:
        - name: watcher
          image: python:3.11-slim
          command: ["python", "/scripts/pod_ip_watcher.py"]
          env:
            - name: PYTHONPATH
              value: "/deps"
            - name: TARGET_NAMESPACE
              value: "" # Leave empty for all namespaces
            - name: OUTPUT_FILE_PATH
              value: "/data/pod_ips.json"
            - name: CONSUL_URI
              value: "" # e.g. "http://consul-server.consul:8500" if pushing to an external Consul agent
            - name: SD_SERVICE_NAME
              value: "my-service"
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http-sd
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: python-deps
              mountPath: /deps
            - name: output-data
              mountPath: /data
      volumes:
        - name: script-vol
          configMap:
            name: pod-ip-watcher-script
        - name: python-deps
          emptyDir: {}
        - name: output-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pod-ip-watcher-sd
  namespace: ip-watcher-system
spec:
  type: ClusterIP
  selector:
    app: pod-ip-watcher
  ports:
    - name: http
      port: 8080
      targetPort: 8080